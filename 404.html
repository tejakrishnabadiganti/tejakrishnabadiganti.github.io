<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Tejakrishna Badiganti</title>
    <link rel="icon" type="image/svg+xml" href="/packages/images/favicon.svg" />
    <style>
      :root { --accent: #0b78d0; --bg: #ffffff; --ink: #0a1b2e; --muted: #465a70; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0a0f15; --ink: #e3ecf5; --muted: #8da3b8; --accent: #38bdf8; }
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--ink);
        padding: 24px;
        text-align: center;
      }
      .wrap { max-width: 480px; }
      .code {
        font-size: 6rem;
        font-weight: 800;
        line-height: 1;
        color: var(--accent);
        margin-bottom: 12px;
      }
      h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 8px; }
      p { color: var(--muted); margin-bottom: 24px; line-height: 1.6; }
      a {
        display: inline-block;
        padding: 12px 28px;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
        transition: opacity 0.15s;
      }
      a:hover { opacity: 0.85; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="code">404</div>
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
      <a href="/">Back to portfolio</a>
    </div>
  </body>
</html>
